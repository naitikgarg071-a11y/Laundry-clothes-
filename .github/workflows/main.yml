
name: Build My Laundry Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q My_Laundry_Manager_Phone_Build_Ready.zip -d .
          ls -la laundry_phone_build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: laundry_phone_build
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Laundry-Manager-APK
          path: laundry_phone_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
